AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EC2 instance for FastAPI backend of Gestion de Proyectos y Tareas TFG project.
  La API se ejecuta como contenedor Docker descargado desde Amazon ECR.
  Importa subnet pública, Security Group, endpoints de RDS, S3 y ECR desde otros stacks.

Parameters:
  ProjectName:
    Type: String
    Default: gestion-proyectos-tareas
    Description: Project name used to identify AWS resources

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t2.micro
      - t3.micro
    Description: EC2 instance type

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 Key Pair name used to connect by SSH

  # AMI más reciente de Amazon Linux 2023 en eu-west-1 via SSM Parameter Store
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI ID from SSM Parameter Store

  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to pull from ECR

  DBUsername:
    Type: String
    Default: dbadmin
    Description: Database username used by the API container

  DBPassword:
    Type: String
    NoEcho: true
    Description: >
      Database password used by the API container.
      Mejora futura: gestionar con AWS Secrets Manager en lugar de parámetro.

Resources:

  # ─────────────────────────────────────────────
  # IAM Role para el EC2
  # Permisos necesarios para:
  # - Hacer pull de imágenes Docker desde ECR
  # - Acceder a los buckets S3 del proyecto
  # - Escribir logs en CloudWatch
  # ─────────────────────────────────────────────
  ApiEC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ec2-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-ec2-ecr-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Pull de imágenes desde ECR
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !ImportValue "gestion-proyectos-tareas-ApiECRRepositoryArn"

        - PolicyName: !Sub "${ProjectName}-ec2-s3-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Lectura del bucket de scripts de base de datos
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !ImportValue "gestion-proyectos-tareas-DatabaseScriptsBucketArn"
                  - !Sub
                    - "${BucketArn}/*"
                    - BucketArn: !ImportValue "gestion-proyectos-tareas-DatabaseScriptsBucketArn"
              # Lectura y escritura del bucket de imágenes de usuario
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !ImportValue "gestion-proyectos-tareas-UserImagesBucketArn"
                  - !Sub
                    - "${BucketArn}/*"
                    - BucketArn: !ImportValue "gestion-proyectos-tareas-UserImagesBucketArn"

        - PolicyName: !Sub "${ProjectName}-ec2-cloudwatch-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ec2-role"
        - Key: Project
          Value: !Ref ProjectName

  ApiEC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-ec2-instance-profile"
      Roles:
        - !Ref ApiEC2Role

  # ─────────────────────────────────────────────
  # Instancia EC2 - API FastAPI
  # Está en la subnet pública para que la app .NET MAUI
  # pueda llamar a la API directamente desde internet.
  # La imagen Docker de la API se obtiene desde ECR,
  # construida por el pipeline del repositorio backend.
  # Las credenciales se pasan como variables de entorno
  # al contenedor. Mejora futura: usar AWS Secrets Manager.
  # ─────────────────────────────────────────────
  ApiEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      # Subnet pública importada desde el stack de VPC
      SubnetId: !ImportValue "gestion-proyectos-tareas-PublicSubnetId"
      # Security Group importado desde el stack de security-groups
      SecurityGroupIds:
        - !ImportValue "gestion-proyectos-tareas-ApiSecurityGroupId"
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref ApiEC2InstanceProfile
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -e

            # Actualizar paquetes del sistema
            dnf update -y

            # Instalar Docker
            dnf install -y docker
            systemctl enable docker
            systemctl start docker

            # Añadir ec2-user al grupo docker para ejecutar sin sudo
            usermod -aG docker ec2-user

            # Variables de entorno
            REGION=$(curl -s http://169.254.169.254/latest/meta-data/placement/region)
            ECR_REPOSITORY_URI="${ECRRepositoryUri}"
            IMAGE="${ECRRepositoryUri}:${ImageTag}"

            # Login en ECR
            aws ecr get-login-password --region $REGION | \
              docker login --username AWS --password-stdin \
              $(echo $ECR_REPOSITORY_URI | cut -d'/' -f1)

            # Pull de la imagen de la API desde ECR
            docker pull $IMAGE

            # Detener y eliminar el contenedor anterior si existe
            docker stop ${ProjectName}-api 2>/dev/null || true
            docker rm ${ProjectName}-api 2>/dev/null || true

            # Ejecutar el contenedor de la API FastAPI en el puerto 8000
            docker run -d \
              --name ${ProjectName}-api \
              --restart unless-stopped \
              -p 8000:8000 \
              -e DB_HOST="${DBHost}" \
              -e DB_PORT="${DBPort}" \
              -e DB_NAME="${DBName}" \
              -e DB_USER="${DBUsername}" \
              -e DB_PASSWORD="${DBPassword}" \
              -e USER_IMAGES_BUCKET="${UserImagesBucket}" \
              -e DATABASE_SCRIPTS_BUCKET="${DatabaseScriptsBucket}" \
              -e AWS_REGION=$REGION \
              $IMAGE

            echo "API container started successfully"
          - ECRRepositoryUri: !ImportValue "gestion-proyectos-tareas-ApiECRRepositoryUri"
            DBHost: !ImportValue "gestion-proyectos-tareas-DBEndpointAddress"
            DBPort: !ImportValue "gestion-proyectos-tareas-DBEndpointPort"
            DBName: !ImportValue "gestion-proyectos-tareas-DBName"
            UserImagesBucket: !ImportValue "gestion-proyectos-tareas-UserImagesBucketName"
            DatabaseScriptsBucket: !ImportValue "gestion-proyectos-tareas-DatabaseScriptsBucketName"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-api-ec2"
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  ApiEC2InstanceId:
    Description: EC2 instance ID
    Value: !Ref ApiEC2Instance
    Export:
      Name: !Sub "${ProjectName}-ApiEC2InstanceId"

  ApiEC2PublicIp:
    Description: EC2 public IP address
    Value: !GetAtt ApiEC2Instance.PublicIp
    Export:
      Name: !Sub "${ProjectName}-ApiEC2PublicIp"

  ApiEC2PublicDnsName:
    Description: EC2 public DNS name
    Value: !GetAtt ApiEC2Instance.PublicDnsName
    Export:
      Name: !Sub "${ProjectName}-ApiEC2PublicDnsName"

