name: Infraestructura CI - Gestión de Proyectos y Tareas

on:
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Billing Alarm
  # Región obligatoria: us-east-1
  # ─────────────────────────────────────────────
  deploy-billing-alarm:
    name: Validate and Deploy Billing Alarm Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for billing
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Validate billing alarm template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/templates/monitoring/billing-alarm.yml \
            --region us-east-1

      - name: Deploy billing alarm stack
        run: |
          aws cloudformation deploy \
            --template-file infra/templates/monitoring/billing-alarm.yml \
            --stack-name gestion-proyectos-tareas-billing-alarm \
            --parameter-overrides \
              ProjectName=gestion-proyectos-tareas \
              AlertEmail1=${{ secrets.ALERT_EMAIL1 }} \
              AlertEmail2="${{ secrets.ALERT_EMAIL2 }}" \
              BillingThreshold=1 \
            --no-fail-on-empty-changeset \
            --region us-east-1

      - name: Verify billing alarm stack status
        run: |
          aws cloudformation describe-stacks \
            --stack-name gestion-proyectos-tareas-billing-alarm \
            --region us-east-1 \
            --query "Stacks[0].StackStatus" \
            --output text

  # ─────────────────────────────────────────────
  # JOB 2: VPC
  # Región principal: eu-west-1
  # Se ejecuta después del billing alarm
  # ─────────────────────────────────────────────
  deploy-vpc:
    name: Validate and Deploy VPC Stack
    runs-on: ubuntu-latest
    needs: deploy-billing-alarm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for infrastructure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate VPC template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/templates/network/vpc.yml \
            --region ${{ secrets.AWS_REGION }}

      - name: Deploy VPC stack
        run: |
          aws cloudformation deploy \
            --template-file infra/templates/network/vpc.yml \
            --stack-name gestion-proyectos-tareas-vpc \
            --parameter-overrides \
              ProjectName=gestion-proyectos-tareas \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

      - name: Verify VPC stack status
        run: |
          aws cloudformation describe-stacks \
            --stack-name gestion-proyectos-tareas-vpc \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].StackStatus" \
            --output text

  # ─────────────────────────────────────────────
  # JOB 3: Security Groups
  # Región principal: eu-west-1
  # Depende de la VPC porque importa el VpcId
  # ─────────────────────────────────────────────
  deploy-security-groups:
    name: Validate and Deploy Security Groups Stack
    runs-on: ubuntu-latest
    needs: deploy-vpc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for infrastructure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate security groups template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/templates/security/security-groups.yml \
            --region ${{ secrets.AWS_REGION }}

      - name: Deploy security groups stack
        run: |
          aws cloudformation deploy \
            --template-file infra/templates/security/security-groups.yml \
            --stack-name gestion-proyectos-tareas-security-groups \
            --parameter-overrides \
              ProjectName=gestion-proyectos-tareas \
              AllowedSshCidr=${{ secrets.ALLOWED_SSH_CIDR }} \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

      - name: Verify security groups stack status
        run: |
          aws cloudformation describe-stacks \
            --stack-name gestion-proyectos-tareas-security-groups \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].StackStatus" \
            --output text



