name: Infraestructura CI - Gestión de Proyectos y Tareas

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Billing Alarm
  # Región obligatoria: us-east-1
  # ─────────────────────────────────────────────
  deploy-billing-alarm:
    name: Validate and Deploy Billing Alarm Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for billing
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Validate billing alarm template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/templates/monitoring/billing-alarm.yml \
            --region us-east-1

      - name: Deploy billing alarm stack
        run: |
          aws cloudformation deploy \
            --template-file infra/templates/monitoring/billing-alarm.yml \
            --stack-name gestion-proyectos-tareas-billing-alarm \
            --parameter-overrides \
              ProjectName=gestion-proyectos-tareas \
              AlertEmail1=${{ secrets.ALERT_EMAIL1 }} \
              AlertEmail2="${{ secrets.ALERT_EMAIL2 }}" \
              BillingThreshold=1 \
            --no-fail-on-empty-changeset \
            --region us-east-1

      - name: Verify billing alarm stack status
        run: |
          aws cloudformation describe-stacks \
            --stack-name gestion-proyectos-tareas-billing-alarm \
            --region us-east-1 \
            --query "Stacks[0].StackStatus" \
            --output text

  # ─────────────────────────────────────────────
  # JOB 2: ECR Repository
  # Región principal: eu-west-1
  # Independiente de VPC y RDS, corre en paralelo
  # ─────────────────────────────────────────────
  deploy-ecr:
    name: Validate and Deploy ECR Repository Stack
    runs-on: ubuntu-latest
    needs: deploy-billing-alarm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for infrastructure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate ECR template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/templates/compute/ecr-api.yml \
            --region ${{ secrets.AWS_REGION }}

      - name: Deploy ECR stack
        run: |
          aws cloudformation deploy \
            --template-file infra/templates/compute/ecr-api.yml \
            --stack-name gestion-proyectos-tareas-ecr \
            --parameter-overrides \
              ProjectName=gestion-proyectos-tareas \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

      - name: Verify ECR stack status
        run: |
          aws cloudformation describe-stacks \
            --stack-name gestion-proyectos-tareas-ecr \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].StackStatus" \
            --output text

  # ─────────────────────────────────────────────
  # JOB 3: S3 Buckets
  # Región principal: eu-west-1
  # Independiente de VPC, corre en paralelo con deploy-vpc
  # ─────────────────────────────────────────────
  deploy-s3:
    name: Validate and Deploy S3 Buckets Stack
    runs-on: ubuntu-latest
    needs: deploy-billing-alarm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for infrastructure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate S3 buckets template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/templates/storage/s3-buckets.yml \
            --region ${{ secrets.AWS_REGION }}

      - name: Deploy S3 buckets stack
        run: |
          aws cloudformation deploy \
            --template-file infra/templates/storage/s3-buckets.yml \
            --stack-name gestion-proyectos-tareas-s3 \
            --parameter-overrides \
              ProjectName=gestion-proyectos-tareas \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

      - name: Verify S3 stack status
        run: |
          aws cloudformation describe-stacks \
            --stack-name gestion-proyectos-tareas-s3 \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].StackStatus" \
            --output text

  # ─────────────────────────────────────────────
  # JOB 4: VPC
  # Región principal: eu-west-1
  # Se ejecuta después del billing alarm
  # ─────────────────────────────────────────────
  deploy-vpc:
    name: Validate and Deploy VPC Stack
    runs-on: ubuntu-latest
    needs: deploy-billing-alarm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for infrastructure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate VPC template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/templates/network/vpc.yml \
            --region ${{ secrets.AWS_REGION }}

      - name: Deploy VPC stack
        run: |
          aws cloudformation deploy \
            --template-file infra/templates/network/vpc.yml \
            --stack-name gestion-proyectos-tareas-vpc \
            --parameter-overrides \
              ProjectName=gestion-proyectos-tareas \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

      - name: Verify VPC stack status
        run: |
          aws cloudformation describe-stacks \
            --stack-name gestion-proyectos-tareas-vpc \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].StackStatus" \
            --output text

  # ─────────────────────────────────────────────
  # JOB 5: Security Groups
  # Región principal: eu-west-1
  # Depende de la VPC porque importa el VpcId
  # ─────────────────────────────────────────────
  deploy-security-groups:
    name: Validate and Deploy Security Groups Stack
    runs-on: ubuntu-latest
    needs: deploy-vpc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for infrastructure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate security groups template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/templates/security/security-groups.yml \
            --region ${{ secrets.AWS_REGION }}

      - name: Deploy security groups stack
        run: |
          aws cloudformation deploy \
            --template-file infra/templates/security/security-groups.yml \
            --stack-name gestion-proyectos-tareas-security-groups \
            --parameter-overrides \
              ProjectName=gestion-proyectos-tareas \
              AllowedSshCidr="${{ secrets.ALLOWED_SSH_CIDR || '0.0.0.0/0' }}" \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

      - name: Show stack events on failure
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name gestion-proyectos-tareas-security-groups \
            --region ${{ secrets.AWS_REGION }} \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED'].{Resource:LogicalResourceId,Reason:ResourceStatusReason}" \
            --output table

      - name: Verify security groups stack status
        run: |
          aws cloudformation describe-stacks \
            --stack-name gestion-proyectos-tareas-security-groups \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].StackStatus" \
            --output text

  # ─────────────────────────────────────────────
  # JOB 6: RDS PostgreSQL
  # Región principal: eu-west-1
  # Depende de los Security Groups (importa DatabaseSecurityGroupId)
  # ─────────────────────────────────────────────
  deploy-rds:
    name: Validate and Deploy RDS PostgreSQL Stack
    runs-on: ubuntu-latest
    needs: deploy-security-groups

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for infrastructure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate RDS template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/templates/database/rds-postgres.yml \
            --region ${{ secrets.AWS_REGION }}

      - name: Deploy RDS stack
        run: |
          aws cloudformation deploy \
            --template-file infra/templates/database/rds-postgres.yml \
            --stack-name gestion-proyectos-tareas-rds \
            --parameter-overrides \
              ProjectName=gestion-proyectos-tareas \
              DBName=${{ secrets.DB_NAME }} \
              DBUsername=${{ secrets.DB_USERNAME }} \
              DBPassword=${{ secrets.DB_PASSWORD }} \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

      - name: Show RDS stack events on failure
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name gestion-proyectos-tareas-rds \
            --region ${{ secrets.AWS_REGION }} \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED'].{Resource:LogicalResourceId,Reason:ResourceStatusReason}" \
            --output table

      - name: Verify RDS stack status
        run: |
          aws cloudformation describe-stacks \
            --stack-name gestion-proyectos-tareas-rds \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].StackStatus" \
            --output text

  # ─────────────────────────────────────────────
  # JOB 7: EC2 - API FastAPI
  # Región principal: eu-west-1
  # Depende de RDS y S3 (importa endpoints y bucket names)
  # ─────────────────────────────────────────────
  deploy-ec2:
    name: Validate and Deploy EC2 API Stack
    runs-on: ubuntu-latest
    needs: [deploy-rds, deploy-s3, deploy-ecr]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials for infrastructure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate EC2 template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/templates/compute/ec2-api.yml \
            --region ${{ secrets.AWS_REGION }}

      - name: Deploy EC2 stack
        run: |
          aws cloudformation deploy \
            --template-file infra/templates/compute/ec2-api.yml \
            --stack-name gestion-proyectos-tareas-ec2 \
            --parameter-overrides \
              ProjectName=gestion-proyectos-tareas \
              InstanceType=t3.micro \
              KeyName=${{ secrets.EC2_KEY_NAME }} \
              ImageTag=latest \
              DBUsername=${{ secrets.DB_USERNAME }} \
              DBPassword=${{ secrets.DB_PASSWORD }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION }}

      - name: Show EC2 stack events on failure
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name gestion-proyectos-tareas-ec2 \
            --region ${{ secrets.AWS_REGION }} \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED'].{Resource:LogicalResourceId,Reason:ResourceStatusReason}" \
            --output table

      - name: Verify EC2 stack status
        run: |
          aws cloudformation describe-stacks \
            --stack-name gestion-proyectos-tareas-ec2 \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].StackStatus" \
            --output text


